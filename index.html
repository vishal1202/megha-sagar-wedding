  :root {

  * { box-sizing: border-box; margin: 0; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px; position: relative; }
  h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; }
  button { font: inherit; }
  a { color: var(--rose); }

          h("circle", { cx: 42, cy: 104, r: 3.5, fill: "#d9b66f" }), h("circle", { cx: 60, cy: 110, r: 3.5, fill: "#d9b66f" }), h("circle", { cx: 78, cy: 104, r: 3.5, fill: "#d9b66f" }))),
      h("p", { className: "msg", role: "status" }, lit ? "The jyot is lit. Join us on 15 January for Mata Ki Jyot." : "Tap the diya to light the jyot"),
      h("p", null, lit ? "May Mata Rani bless us all." : "Every wedding begins with a blessing."));
  }

  /* ---------- Quiz and guest pass ---------- */
  var TYPES = {
    a: { name: "The Floor Destroyer", text: "You started dancing before the DJ plugged in. Three uncles joined you out of fear and one is still stuck in the bhangra.", job: "Open the floor, close the floor, repeat." },
    b: { name: "The Gulab Jamun Mafia", text: "You know which counter has the hot jalebis and you are not sharing. The caterer has you on speed dial.", job: "Guard the dessert counter until midnight." },
    c: { name: "The Reel Maker", text: "You have filmed the wedding from forty angles and eaten nothing. The aunty in the background is now famous.", job: "Post the reel before the couple finishes the pheras." },
    d: { name: "The Gift Auditor", text: "You know who gave what, who gave less, and who gave nothing. The whole family fears your memory.", job: "Update the record every anniversary." }
  };
  var QS = [
    { q: "Breaking news: the bride's cousins have stolen the groom's shoes. Your move?", o: [["Challenge them to a dance-off for the shoes", "a"], ["Bribe them with a plate of gulab jamun", "b"], ["Livestream the whole negotiation", "c"], ["Demand a receipt for the ransom", "d"]] },
    { q: "A relative you have never met hugs you and cries. You...", o: [["Spin them into a dance", "a"], ["Offer them a samosa", "b"], ["Take a selfie captioned 'family'", "c"], ["Quietly ask what gift they brought", "d"]] },
    { q: "The buffet has 47 counters. Your survival plan?", o: [["Dance between counters to burn it off", "a"], ["Colour-coded map, finished in one lap", "b"], ["Photograph all 47, eat none (it is cold now)", "c"], ["Skip to the counter with the sweets", "d"]] },
    { q: "The photographer shouts 'last one!' for the 15th time. You...", o: [["Strike a dance pose", "a"], ["Ask if the buffet is still open", "b"], ["Smile harder, nobody is leaving", "c"], ["Start charging him a photo fee", "d"]] },
    { q: "It is 1 am and the DJ refuses to stop. Where are you?", o: [["On the floor, shoes off, still going", "a"], ["Third dessert, zero regrets", "b"], ["Asleep in the background of a photo", "c"], ["Counting who left without giving a gift", "d"]] }
  ];

  function Quiz() {
    var a = useState(-1), step = a[0], setStep = a[1];       // -1 name, 0..3 questions, 4 result
    var b = useState(""), guest = b[0], setGuest = b[1];
    var c = useState([]), picks = c[0], setPicks = c[1];
    var d = useState(""), note = d[0], setNote = d[1];

    function restart() { setStep(-1); setPicks([]); setNote(""); }
    function pick(k) { setPicks(picks.concat([k])); setStep(step + 1); }

    var bars = QS.map(function (_, k) { return h("i", { key: k, className: step >= k ? "on" : "" }); });
    var body;

    if (step === -1) {
      body = h("form", { className: "step field", key: "name", onSubmit: function (e) { e.preventDefault(); setStep(0); } },
        h("p", { className: "q" }, "First, what should we call you?"),
        h("label", { htmlFor: "guest-name", style: { position: "absolute", left: "-9999px" } }, "Your name"),
        h("input", { id: "guest-name", type: "text", maxLength: 28, placeholder: "Your name", value: guest, autoComplete: "given-name", onChange: function (e) { setGuest(e.target.value); } }),
        h("div", { className: "actions" }, h("button", { type: "submit", id: "start", className: "btn" }, "Start the quiz")));
    } else if (step < QS.length) {
      var q = QS[step];
      body = h("div", { className: "step", key: "q" + step },
        h("p", { className: "q" }, q.q),
        h("div", { className: "opts" }, q.o.map(function (o, k) {
          return h("button", { key: k, id: "opt-" + step + "-" + k, type: "button", className: "opt", onClick: function () { pick(o[1]); } }, o[0]);
        })));
    } else {
      var tally = {}; picks.forEach(function (k) { tally[k] = (tally[k] || 0) + 1; });
      var best = "a", n = -1;
      Object.keys(TYPES).forEach(function (k) { if ((tally[k] || 0) > n) { n = tally[k] || 0; best = k; } });
      var t = TYPES[best], who = guest.trim() || "Dear Guest";
      var msg = who + " is " + t.name + " at Megha & Sagar's wedding on 16 Jan 2027. " + t.job + " What are you?";
      body = h("div", { className: "step", key: "res" },
        h("div", { className: "pass" },
          h("div", { className: "top" },
            h("div", { className: "kick" }, "Guest pass"),
            h("div", { className: "who" }, who),
            h("div", { className: "role" }, t.name)),
          h("div", { className: "bot" },
            h("p", null, t.text),
            h("p", { className: "job" }, "Your job: " + t.job.charAt(0).toLowerCase() + t.job.slice(1)),
            h("p", { className: "admit" }, "Admit one · 16 Jan 2027 · Royal Garden, Warap"), h("p", { className: "admit" }, "Gifts are noticed. Presence is treasured."))),
        h("div", { className: "actions" },
          h("button", { type: "button", id: "copy-pass", className: "btn", onClick: function () { copyText(msg + " " + location.href, setNote, "Copied. Send it to the family group."); } }, "Copy my pass"),
          h("button", { type: "button", id: "again", className: "btn ghost", onClick: restart }, "Take it again")),
        h("p", { className: "note", role: "status" }, note));
    }

    return h("section", { className: "quiz", "aria-labelledby": "quiz-h" },
      h("h2", { className: "sec-title", id: "quiz-h" }, "Which wedding guest are you?"),
      h("p", { className: "sec-sub", style: { marginBottom: 0 } }, "Five questions, zero logic. Your guest type gets printed on your pass."),
      h("div", { className: "progress", "aria-hidden": "true" }, bars),
      body);
  }

  /* ---------- Petals ---------- */
  function Shower(props) {
    return h("div", { className: "shower", "aria-hidden": "true" }, props.petals.map(function (p) {
      return h("span", { key: p.id, className: "bp", style: { left: p.left + "%", width: p.w, height: p.w * 1.4, background: p.c, "--dur": p.dur + "s", "--dl": p.dl + "s", "--drift": p.drift + "px" } });
    }));
  }

  /* ---------- App ---------- */
  function App() {
    var s = useState([]), petals = s[0], setPetals = s[1];

    useEffect(function () {
      function move(e) {
        var r = document.documentElement;
        r.style.setProperty("--px", (e.clientX / window.innerWidth - 0.5).toFixed(3));
        r.style.setProperty("--py", (e.clientY / window.innerHeight - 0.5).toFixed(3));
      }
      window.addEventListener("pointermove", move);
      return function () { window.removeEventListener("pointermove", move); };
    }, []);

    function shower() {
      var batch = [], base = Date.now();
      for (var k = 0; k < 30; k++) {
        batch.push({ id: base + "-" + k, left: Math.random() * 100, w: 10 + Math.random() * 10, c: Math.random() > 0.5 ? "#c27780" : "#e8b4b8", dur: (2.6 + Math.random() * 2).toFixed(2), dl: (Math.random() * 1.2).toFixed(2), drift: Math.round(Math.random() * 120 - 60) });
      }
      setPetals(function (p) { return p.concat(batch); });
      setTimeout(function () { setPetals(function (p) { return p.filter(function (x) { return batch.indexOf(x) === -1; }); }); }, 5600);
    }

    return h("div", { className: "page" },
      h("svg", { className: "corner tl", "aria-hidden": "true", viewBox: "0 0 200 300" }, h("use", { href: "#sprig" })),
      h("svg", { className: "corner br", "aria-hidden": "true", viewBox: "0 0 200 300" }, h("use", { href: "#sprig" })),
      h(Shower, { petals: petals }),
      h("main", { className: "wrap" },
        h("header", { className: "hero" },
          h("p", { className: "eyebrow rise", style: { "--d": "2.7s" } }, "Together with our families"),
          h("h1", { className: "rise", style: { "--d": "2.9s" } }, "Megha ", h("span", { className: "amp" }, "&"), " Sagar"),
          h("hr", { className: "rule rise", style: { "--d": "3.1s" } }),
          h("p", { className: "date rise", style: { "--d": "3.2s" } }, "16 · 01 · 2027"),
          h("p", { className: "where rise", style: { "--d": "3.3s" } }, "Royal Garden, Warap"),
          h(Countdown),
          h("button", { type: "button", id: "shower", className: "textbtn rise", style: { "--d": "3.7s" }, onClick: shower }, "Shower us with petals")),
        h(Events),
        h("section", null, h(Jyot)),
        h("section", { className: "venue", "aria-label": "Venue" },
          h("h3", null, "Royal Garden"),
          h("p", null, "Warap")),
        h(Quiz)),
      h("footer", null,
        h("div", { className: "sign" }, "Megha & Sagar"),
        h("p", null, "Your presence is the only gift we ask for.")));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));

  document.getElementById("skip").addEventListener("click", function () {
    document.getElementById("veil").classList.add("skip");
    document.querySelectorAll(".rise").forEach(function (el) { el.style.setProperty("--d", "0s"); });
  });
})();
</script>
